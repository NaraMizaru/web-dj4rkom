# Base URL used when generating links to your pages
baseURL = 'https://web-dj4rkom.pages.dev'

# Modern custom theme for Dj4rkom
theme = 'dj4rkom'

# Basic metadata configuration for your blog
title = "Dj4rkom"
author = "Tim Dj4rkom"
copyright = "Copyright © 2026 Dj4rkom. All rights reserved."
locale = "id-ID"

# Enable robots.txt generation
enableRobotsTXT = true

# Permalinks configuration
[permalinks]
  blog = "/blog/:slug/"
  tags = "/tags/:slug/"

# Enable JSON output on home page for live search index
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Blog dan publikasi teknologi seputar jaringan komputer, protokol internet, dan keamanan siber."
  favicon = "images/favicon.png"
  images = ["images/4-langkah-bagaimana-cara-dns-bekerja-1.jpg"]
  title = "Dj4rkom"
  author = "Tim Dj4rkom"
  dateFormat = "02 Jan 2006"

# Markup and Syntax Highlighting
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    lineNumbersInTable = false
    codeFences = true
    guessSyntax = true
